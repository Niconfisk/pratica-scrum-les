<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Minhas Tarefas</h1>
        
        <div class="input-group mb-4">
            <input type="text" class="form-control" id="nova-tarefa-titulo" placeholder="Digite o título da tarefa...">
            <button class="btn btn-primary" id="btn-adicionar">Adicionar</button>
        </div>

        <div class="row" id="quadro-tarefas">
            <div class="col-md-4">
                <div class="card bg-light">
                    <div class="card-header bg-secondary text-white text-center fw-bold">A Fazer</div>
                    <div class="card-body" id="col-a-fazer"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-light">
                    <div class="card-header bg-primary text-white text-center fw-bold">Fazendo</div>
                    <div class="card-body" id="col-fazendo"></div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-light">
                    <div class="card-header bg-success text-white text-center fw-bold">Feita</div>
                    <div class="card-body" id="col-feita"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
